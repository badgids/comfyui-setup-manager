    nvidia_cuda129: https://download.pytorch.org/whl/cu129
    rocm: https://download.pytorch.org/whl/rocm6.4
    rocm64: https://download.pytorch.org/whl/rocm6.4
    cpu: https://download.pytorch.org/whl/cpu
    mps: ''
  fallback_unpinned: true
constraints: {}
extra_python_packages: []
system_dependencies:
- id: git
  name: Git
  commands:
  - git
  required: true
  why: Clones the official ComfyUI repository.
- id: ffmpeg
  name: FFmpeg
  commands:
  - ffmpeg
  - ffprobe
  required: false
  why: Audio and video workflows.
nodes: []
accelerated_packages: []
post_install:
  copy_websocket_example: false
  generate_launchers: true
  validate_imports:
  - torch
export_metadata:
