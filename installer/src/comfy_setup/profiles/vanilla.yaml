  models_included: false
  machine_paths_included: false
  remote_node_count: 0
  embedded_unpublished_node_count: 0
models: []
workflows: []
asset_sources:
  models:
    schema_version: 1
    sources: []
    entries: []
  workflows:
    schema_version: 1
    sources: []
    entries: []
libraries:
  shared_models:
    enabled: true
    required: false
    description: Use one external model library across managed ComfyUI installations.
  shared_workflows:
    enabled: true
    required: false
    description: Use one external workflow library across managed ComfyUI installations.
  paths_embedded: false
