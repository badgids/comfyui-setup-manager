schema_version: 1
metadata:
  name: ComfyUI Setup Manager precompiled wheel sources
  description: Editable registry of official, curated third-party, and user-built wheel sources. Entries are matched
    against the target operating system, architecture, Python wheel tags, PyTorch version, and acceleration runtime.
  source_priority:
  - Custom/Local
  - Official
  - 3rd Party
  documentation:
    pytorch: https://pytorch.org/get-started/previous-versions/
    flash_attention: https://github.com/Dao-AILab/flash-attention/releases
    cupy: https://docs.cupy.dev/en/stable/install.html
    tensorrt: https://docs.nvidia.com/deeplearning/tensorrt/latest/installing-tensorrt/installing.html
  badgids_profile_coverage:
    linux_nvidia: Full accelerated path when matching wheels exist; WSL2 uses the Linux wheel path.
    windows_nvidia: Uses official packages plus curated Windows FlashAttention, SageAttention, and Triton sources.
    linux_rocm: Uses official ROCm PyTorch; CUDA-only Badgids components are disabled with explanations.
    macos_mps: Uses official macOS/MPS PyTorch; CUDA-only components are disabled because upstream does not publish
      macOS CUDA wheels.
    cpu_only: Uses official CPU PyTorch; CUDA/ROCm-only components are disabled.
sources:
- id: official-flash-attention-releases
  enabled: true
  label: Official
  package: flash-attn
  kind: github-releases
  location: https://github.com/Dao-AILab/flash-attention
  platforms:
  - linux
  architectures:
  - x86_64
  - aarch64
  accelerators:
  - nvidia
  priority: 100
  notes: Upstream release assets. The manager validates Python, platform, PyTorch, CUDA and ABI markers before installation.
- id: official-cupy-pypi
